<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 445" width="1500" height="445" role="img"><title>目标业务与首期服务范围</title><defs><linearGradient id="panel" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#FFFFFF"></stop><stop offset="100%" stop-color="#DDEDFB"></stop></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#519CE0"></stop><stop offset="55%" stop-color="#236BB0"></stop><stop offset="100%" stop-color="#174B78"></stop></linearGradient><linearGradient id="deep" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#387CB6"></stop><stop offset="100%" stop-color="#123E69"></stop></linearGradient><linearGradient id="pale" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#F6FBFF"></stop><stop offset="100%" stop-color="#AFCFEB"></stop></linearGradient><filter id="shadow" x="-15%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#235A87" flood-opacity="0.13"></feDropShadow></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#236BB0"></path></marker></defs><rect x="0" y="0" width="1500" height="445" fill="#FFFFFF" stroke="none" stroke-width="2" rx="6"></rect><rect x="47" y="39" width="440" height="300" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="40" y="30" width="440" height="300" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="40" y="30" width="440" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M52,32 H468" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="260.0" y="68" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="416">业务入口</text><text x="62" y="126" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-w