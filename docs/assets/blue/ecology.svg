<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 485" width="1500" height="485" role="img"><title>工行信贷生态与前置核验协同</title><defs><linearGradient id="panel" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#FFFFFF"></stop><stop offset="100%" stop-color="#DDEDFB"></stop></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#519CE0"></stop><stop offset="55%" stop-color="#236BB0"></stop><stop offset="100%" stop-color="#174B78"></stop></linearGradient><linearGradient id="deep" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#387CB6"></stop><stop offset="100%" stop-color="#123E69"></stop></linearGradient><linearGradient id="pale" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#F6FBFF"></stop><stop offset="100%" stop-color="#AFCFEB"></stop></linearGradient><filter id="shadow" x="-15%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#235A87" flood-opacity="0.13"></feDropShadow></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#236BB0"></path></marker></defs><rect x="0" y="0" width="1500" height="485" fill="#FFFFFF" stroke="none" stroke-width="2" rx="6"></rect><rect x="44" y="20" width="1420" height="58" fill="#CFDFEE" stroke="none" stroke-width="2" rx="6"></rect><rect x="40" y="15" width="1420" height="58" fill="url(#deep)" stroke="none" stroke-width="2" rx="6"></rect><text x="750" y="54" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="1370">工银智涌能力体系与智贷通融资业务场景</text><rect x="47" y="124" width="425" height="235" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="40" y="115" width="425" height="235" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="40" y="115" width="425" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M52,117 H453" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="252.5" y="153" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="401">材料归集与经办处理</text><text x="62" y="211" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="381">归集申请及经营材料</text><text x="62" y="254" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="381">检查主体、期间与口径</text><text x="62" y="297" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="381">承接补件与经营核实</text><rect x="542" y="124" width="425" height="235" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="535" y="115" width="425" height="235" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="535" y="115" width="425" height="55" fill="url(#deep)" stroke="none" stroke-width="2" rx="8"></rect><path d="M547,117 H948" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="747.5" y="153" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="401">本项目前置核验组件</text><text x="557" y="211" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="381">用途一致性与经营矛盾</text><text x="557" y="254" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="381">Jev有限候选判断</text><text x="557" y="297" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="381">成对原文与待处理事项</text><rect x="1037" y="124" width="425" height="235" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="1030" y="115" width="425" height="235" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="1030" y="115" width="425" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M1042,117 H1443" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="1242.5" y="153" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="401">工小审相关评审任务</text><text x="1052" y="211" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="381">辅助核对材料与疑点</text><text x="1052" y="254" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="381">按需协同复杂分析</text><text x="1052" y="297" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="381">人员形成综合评审意见</text><path d="M475,235 L522,235" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><path d="M970,235 L1017,235" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><rect x="40" y="380" width="1420" height="62" fill="#EAF3FB" stroke="#BDD3E6" stroke-width="2" rx="6"></rect><text x="750" y="422" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="30" font-weight="700" text-anchor="middle" data-fit-width="1380">协同边界  材料归集后接收任务，综合审查前交付核验事项包</text><text x="750" y="478" fill="#59758A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="middle" data-fit-width="1430">银行系统定位依据公开披露；组件关系为拟议业务设计。</text></svg>