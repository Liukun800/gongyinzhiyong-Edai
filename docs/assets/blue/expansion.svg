<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 365" width="1500" height="365" role="img"><title>同类任务扩展与交付验收</title><defs><linearGradient id="panel" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#FFFFFF"></stop><stop offset="100%" stop-color="#DDEDFB"></stop></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#519CE0"></stop><stop offset="55%" stop-color="#236BB0"></stop><stop offset="100%" stop-color="#174B78"></stop></linearGradient><linearGradient id="deep" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#387CB6"></stop><stop offset="100%" stop-color="#123E69"></stop></linearGradient><linearGradient id="pale" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#F6FBFF"></stop><stop offset="100%" stop-color="#AFCFEB"></stop></linearGradient><filter id="shadow" x="-15%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#235A87" flood-opacity="0.13"></feDropShadow></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#236BB0"></path></marker></defs><rect x="0" y="0" width="1500" height="365" fill="#FFFFFF" stroke="none" stroke-width="2" rx="6"></rect><rect x="47" y="34" width="325" height="185" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="40" y="25" width="325" height="185" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="40" y="25" width="325" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M52,27 H353" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="202.5" y="63" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="301">明确新增任务</text><text x="62" y="121" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">确定材料关系与答案</text><text x="62" y="164" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">定义证据及责任人员</text><path d="M374,115 L395,115" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><rect x="412" y="34" width="325" height="185" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="405" y="25" width="325" height="185" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="405" y="25" width="325" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M417,27 H718" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="567.5" y="63" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="301">复用稳定组件</text><text x="427" y="121" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">沿用版本与原文索引</text><text x="427" y="164" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">配置任务和候选标准</text><path d="M739,115 L760,115" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><rect x="777" y="34" width="325" height="185" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="770" y="25" width="325" height="185" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="770" y="25" width="325" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M782,27 H1083" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="932.5" y="63" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="301">重新验证增量</text><text x="792" y="121" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">新资料质量与关键错误</text><text x="792" y="164" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">人员工时及完整成本</text><path d="M1104,115 L1125,115" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><rect x="1142" y="34" width="325" height="185" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="1135" y="25" width="325" height="185" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="1135" y="25" width="325" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M1147,27 H1448" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="1297.5" y="63" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="301">按范围交付</text><text x="1157" y="121" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">验收任务与使用范围</text><text x="1157" y="164" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">交付记录与异常恢复</text><rect x="44" y="255" width="1420" height="58" fill="#CFDFEE" stroke="none" stroke-width="2" rx="6"></rect><rect x="40" y="250" width="1420" height="58" fill="url(#deep)" stroke="none" stroke-width="2" rx="6"></rect><text x="750" y="289" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="1370">先扩展相同材料关系的核验任务，再按证据确定下一步范围</text><text x="750" y="349" fill="#59758A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="middle" data-fit-width="1430">新任务分别验证，模型与业务范围按版本管理。</text></svg>