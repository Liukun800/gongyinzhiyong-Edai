ght="400" text-anchor="start" data-fit-width="455">恢复原处理流程</text><path d="M313,407 L335,407" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><path d="M913,407 L953,407" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><text x="750" y="509" fill="#59758A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="middle" data-fit-width="1430">路由依据是材料条件与问题性质；模型分数单独用于判断不确定性评价。</text></svg>