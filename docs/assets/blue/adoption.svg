<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img"><title>模型采用的分层判断依据</title><defs><linearGradient id="panel" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#FFFFFF"></stop><stop offset="100%" stop-color="#DDEDFB"></stop></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#519CE0"></stop><stop offset="55%" stop-color="#236BB0"></stop><stop offset="100%" stop-color="#174B78"></stop></linearGradient><linearGradient id="deep" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#387CB6"></stop><stop offset="100%" stop-color="#123E69"></stop></linearGradient><linearGradient id="pale" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#F6FBFF"></stop><stop offset="100%" stop-color="#AFCFEB"></stop></linearGradient><filter id="shadow" x="-15%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#235A87" flood-opacity="0.13"></feDropShadow></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#236BB0"></path></marker></defs><rect x="0" y="0" width="1500" height="500" fill="#FFFFFF" stroke="none" stroke-width="2" rx="6"></rect><rect x="47" y="39" width="440" height="305" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="40" y="30" width="440" height="305" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="40" y="30" width="440" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M52,32 H468" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="260.0" y="68" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="416">核验质量门槛</text><text x="62" y="126" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">独立标签与新资料评价</text><text x="62" y="169" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">关键矛盾漏检与误报</text><text x="62" y="212" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">不可比识别与原文支持</text><text x="62" y="255" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">未达要求  保持人员承接</text><rect x="537" y="39" width="440" height="305" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="530" y="30" width="440" height="305" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="530" y="30" width="440" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M542,32 H958" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="750.0" y="68" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="416">协同增量评价</text><text x="552" y="126" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">慢分析是否成功纠错</text><text x="552" y="169" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">是否引入新的错误</text><text x="552" y="212" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">未决事项是否有效承接</text><text x="552" y="255" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">无增益  调整协同范围</text><rect x="1027" y="39" width="440" height="305" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="1020" y="30" width="440" height="305" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="1020" y="30" width="440" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M1032,32 H1448" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="1240.0" y="68" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="416">完整收益评价</text><text x="1042" y="126" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">新增判断与维护开销</text><text x="1042" y="169" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">查证、纠正及补件工时</text><text x="1042" y="212" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">同质量下的响应与费用</text><text x="1042" y="255" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">不划算  替换或限用</text><path d="M488,175 L520,175" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><path d="M978,175 L1010,175" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><rect x="44" y="385" width="1420" height="58" fill="#CFDFEE" stroke="none" stroke-width="2" rx="6"></rect><rect x="40" y="380" width="1420" height="58" fill="url(#deep)" stroke="none" stroke-width="2" rx="6"></rect><text x="750" y="419" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="1370">按任务选择模型与采用范围，选择依据为业务增量</text><text x="750" y="480" fill="#59758A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="middle" data-fit-width="1430">三项共同验收后确定有限辅助使用范围。</text></svg>