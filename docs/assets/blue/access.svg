<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 490" width="1500" height="490" role="img"><title>数据处理授权与责任边界</title><defs><linearGradient id="panel" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#FFFFFF"></stop><stop offset="100%" stop-color="#DDEDFB"></stop></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#519CE0"></stop><stop offset="55%" stop-color="#236BB0"></stop><stop offset="100%" stop-color="#174B78"></stop></linearGradient><linearGradient id="deep" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#387CB6"></stop><stop offset="100%" stop-color="#123E69"></stop></linearGradient><linearGradient id="pale" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#F6FBFF"></stop><stop offset="100%" stop-color="#AFCFEB"></stop></linearGradient><filter id="shadow" x="-15%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#235A87" flood-opacity="0.13"></feDropShadow></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#236BB0"></path></marker></defs><rect x="0" y="0" width="1500" height="490" fill="#FFFFFF" stroke="none" stroke-width="2" rx="6"></rect><rect x="47" y="34" width="440" height="285" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="40" y="25" width="440" height="285" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="40" y="25" width="440" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M52,27 H468" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="260.0" y="63" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="416">材料进入前</text><text x="62" y="121" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">业务方确认任务范围</text><text x="62" y="164" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">数据方确认来源与授权</text><text x="62" y="207" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">明确模型服务与部署环境</text><text x="62" y="250" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">按最小必要范围组织输入</text><rect x="537" y="34" width="440" height="285" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="530" y="25" width="440" height="285" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="530" y="25" width="440" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M542,27 H958" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="750.0" y="63" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="416">材料处理时</text><text x="552" y="121" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">按岗位权限访问原文</text><text x="552" y="164" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">绑定材料与模型版本</text><text x="552" y="207" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">引用、运行和人员动作留痕</text><text x="552" y="250" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">材料指令不改变系统权限</text><rect x="1027" y="34" width="440" height="285" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="1020" y="25" width="440" height="285" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="1020" y="25" width="440" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M1032,27 H1448" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="1240.0" y="63" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="416">结果交接后</text><text x="1042" y="121" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">人员承接建议与疑点</text><text x="1042" y="164" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">按制度留存与恢复</text><text x="1042" y="207" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">异常时停止相关处理</text><text x="1042" y="250" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">复核后按范围恢复服务</text><path d="M488,162 L520,162" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><path d="M978,162 L1010,162" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><rect x="44" y="370" width="1420" height="58" fill="#CFDFEE" stroke="none" stroke-width="2" rx="6"></rect><rect x="40" y="365" width="1420" height="58" fill="url(#deep)" stroke="none" stroke-width="2" rx="6"></rect><text x="750" y="404" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="1370">官方API实验使用自编仿真文本，客户资料按银行获准环境处理</text><text x="750" y="470" fill="#59758A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="middle" data-fit-width="1430">设计依据为数据安全管理要求，不能以服务可调用替代业务数据授权。</text></svg>