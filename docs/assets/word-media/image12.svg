<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 470" width="1500" height="470" role="img"><title>原型运行模式与共同业务闭环</title><defs><linearGradient id="panel" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#FFFFFF"></stop><stop offset="100%" stop-color="#DDEDFB"></stop></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#519CE0"></stop><stop offset="55%" stop-color="#236BB0"></stop><stop offset="100%" stop-color="#174B78"></stop></linearGradient><linearGradient id="deep" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#387CB6"></stop><stop offset="100%" stop-color="#123E69"></stop></linearGradient><linearGradient id="pale" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#F6FBFF"></stop><stop offset="100%" stop-color="#AFCFEB"></stop></linearGradient><filter id="shadow" x="-15%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#235A87" flood-opacity="0.13"></feDropShadow></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#236BB0"></path></marker></defs><rect x="0" y="0" width="1500" height="470" fill="#FFFFFF" stroke="none" stroke-width="2" rx="6"></rect><rect x="47" y="39" width="440" height="215" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="40" y="30" width="440" height="215" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="40" y="30" width="440" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M52,32 H468" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="260.0" y="68" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="416">流程演示</text><text x="62" y="126" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">独立仿真数据库</text><text x="62" y="169" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">预设结论用于操作展示</text><text x="62" y="212" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">展示与模型实测分别标识</text><rect x="537" y="39" width="440" height="215" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="530" y="30" width="440" height="215" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="530" y="30" width="440" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M542,32 H958" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="750.0" y="68" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="416">社区研究模式</text><text x="552" y="126" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">本地快判断真实推理</text><text x="552" y="169" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">慢分析为实验协同</text><text x="552" y="212" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">记录模型与材料版本</text><rect x="1027" y="39" width="440" height="215" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="1020" y="30" width="440" height="215" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="1020" y="30" width="440" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M1032,32 H1448" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="1240.0" y="68" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="416">官方Jev模式</text><text x="1042" y="126" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">独立官方判断服务入口</text><text x="1042" y="169" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">返回答案与用量留存</text><text x="1042" y="212" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">失败或达到上限转人员</text><path d="M260,255 L260,292" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><path d="M750,255 L750,292" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><path d="M1240,255 L1240,292" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><rect x="44" y="310" width="1420" height="58" fill="#CFDFEE" stroke="none" stroke-width="2" rx="6"></rect><rect x="40" y="305" width="1420" height="58" fill="url(#deep)" stroke="none" stroke-width="2" rx="6"></rect><text x="750" y="344" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="1370">共同闭环  材料提交 → 核验建议 → 原文查证 → 人员处理 → 事项交接</text><text x="750" y="419" fill="#59758A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="middle" data-fit-width="1430">各模式均留存材料版本、模型来源及人员处理记录。</text></svg>