<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 425" width="1500" height="425" role="img"><title>人员操作与价值观察点</title><defs><linearGradient id="panel" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#FFFFFF"></stop><stop offset="100%" stop-color="#DDEDFB"></stop></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#519CE0"></stop><stop offset="55%" stop-color="#236BB0"></stop><stop offset="100%" stop-color="#174B78"></stop></linearGradient><linearGradient id="deep" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#387CB6"></stop><stop offset="100%" stop-color="#123E69"></stop></linearGradient><linearGradient id="pale" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#F6FBFF"></stop><stop offset="100%" stop-color="#AFCFEB"></stop></linearGradient><filter id="shadow" x="-15%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#235A87" flood-opacity="0.13"></feDropShadow></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#236BB0"></path></marker></defs><rect x="0" y="0" width="1500" height="425" fill="#FFFFFF" stroke="none" stroke-width="2" rx="6"></rect><rect x="47" y="44" width="440" height="235" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="40" y="35" width="440" height="235" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="40" y="35" width="440" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M52,37 H468" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="260.0" y="73" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="416">材料经办</text><text x="62" y="131" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">看到缺项与可比口径</text><text x="62" y="174" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">补齐后重跑相关任务</text><text x="62" y="217" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">观察  补件往返次数</text><rect x="537" y="44" width="440" height="235" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="530" y="35" width="440" height="235" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="530" y="35" width="440" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M542,37 H958" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="750.0" y="73" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="416">审查复核</text><text x="552" y="131" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">同屏核对成对原文</text><text x="552" y="174" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">确认、更正或继续查证</text><text x="552" y="217" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">观察  查证与纠正工时</text><rect x="1027" y="44" width="440" height="235" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="1020" y="35" width="440" height="235" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="1020" y="35" width="440" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M1032,37 H1448" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="1240.0" y="73" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="416">业务与技术管理</text><text x="1042" y="131" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">追踪未决事项与版本</text><text x="1042" y="174" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">确认交接与异常承接</text><text x="1042" y="217" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="396">观察  遗漏与运行开销</text><rect x="44" y="325" width="1420" height="58" fill="#CFDFEE" stroke="none" stroke-width="2" rx="6"></rect><rect x="40" y="320" width="1420" height="58" fill="url(#deep)" stroke="none" stroke-width="2" rx="6"></rect><text x="750" y="359" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="1370">同一申请绑定材料版本、核验任务和人员处理记录</text><text x="750" y="416" fill="#59758A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="middle" data-fit-width="1430">业务观察以补件、原文查证和未决事项交接的实际操作记录为依据。</text></svg>