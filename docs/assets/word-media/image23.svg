<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="955" viewBox="0 0 1500 955"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#327CB5"/></marker></defs><rect width="1500" height="955" fill="white"/><g font-family="Microsoft YaHei,微软雅黑,sans-serif"><rect x="195" y="16" width="1110" height="80" rx="10" fill="#EAF2FB" stroke="#BDD3EB" stroke-width="2"/><text x="750" y="45" font-size="30" fill="#163E6B" font-weight="700" text-anchor="middle">同批核验任务 · 相同材料、答案与证据要求</text><text x="750" y="84" font-size="26" fill="#173F6F" font-weight="400" text-anchor="middle">共用材料整理与确定性规则；比较待语义判断的任务</text><polyline points="750,96 750,126" fill="none" stroke="#327CB5" stroke-width="3"/><polyline points="750,126 358,126 358,157" fill="none" stroke="#327CB5" stroke-width="3" marker-end="url(#arr)"/><polyline points="750,126 1138,126 1138,157" fill="none" stroke="#327CB5" stroke-width="3" marker-end="url(#arr)"/><rect x="20" y="162" width="675" height="425" rx="10" fill="#F7FAFD" stroke="#BDD3EB" stroke-width="2"/><rect x="785" y="162" width="695" height="425" rx="10" fill="#F3F8FD" stroke="#BDD3EB" stroke-width="2"/><rect x="20" y="162" width="675" height="65" rx="8" fill="#244F7E" stroke="#244F7E" stroke-width="2"/><text x="358" y="205" font-size="31" fill="#FFFFFF" font-weight="700" text-anchor="middle">全量生成对照（实验设定）</text><rect x="785" y="162" width="695" height="65" rx="8" fill="#1766AD" stroke="#1766AD" stroke-width="2"/><text x="1132" y="205" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">前置判断与按需分析（设计路径）</text><rect x="95" y="280" width="525" height="115" rx="10" fill="#FFFFFF" stroke="#BDD3EB" stroke-width="2"/><text x="358" y="325" font-size="31" fill="#173F6F" font-weight="700" text-anchor="middle">所有待语义判断任务</text><text x="358" y="369" font-size="28" fill="#173F6F" font-weight="400" text-anchor="middle">调用同一生成模型</text><text x="358" y="451" font-size="26" fill="#173F6F" font-weight="400" text-anchor="middle">允许短答案、结构化输出与合理缓存</text><text x="358" y="500" font-size="26" fill="#173F6F" font-weight="400" text-anchor="middle">保留真实请求、失败与排队开销</text><rect x="844" y="251" width="575" height="80" rx="10" fill="#FFFFFF" stroke="#BDD3EB" stroke-width="2"/><text x="1132" y="281" font-size="28" fill="#1766AD" font-weight="700" text-anchor="middle">System 1有限判断＋任务状态路由</text><text x="1132" y="320" font-size="24" fill="#173F6F" font-weight="400" text-anchor="middle">分数、材料条件与疑点分别检查</text><polyline points="1132,331 1132,357" fill="none" stroke="#327CB5" stroke-width="3"/><polyline points="1132,357 940,357 940,381" fill="none" stroke="#327CB5" stroke-width="3" marker-end="url(#arr)"/><polyline points="1132,357 1291,357 1291,381" fill="none" stroke="#327CB5" stroke-width="3" marker-end="url(#arr)"/><rect x="820" y="388" width="290" height="106" rx="10" fill="#E3F0FB" stroke="#BDD3EB" stroke-width="2"/><text x="965" y="425" font-size="26" fill="#173F6F" font-weight="700" text-anchor="middle">材料充分、关系复杂</text><text x="965" y="467" font-size="24" fill="#173F6F" font-weight="400" text-anchor="middle">按需调用同一生成模型</text><rect x="1140" y="388" width="315" height="106" rx="10" fill="#FFFFFF" stroke="#BDD3EB" stroke-width="2"/><text x="1297" y="425" font-size="25" fill="#173F6F" font-weight="700" text-anchor="middle">其余任务按状态承接</text><text x="1297" y="467" font-size="24" fill="#173F6F" font-weight="400" text-anchor="middle">结果复核／补充／核实</text><text x="1132" y="553" font-size="26" fill="#173F6F" font-weight="400" text-anchor="middle">不以高分解除明确矛盾的核实要求</text><polyline points="358,587 358,623 750,623" fill="none" stroke="#327CB5" stroke-width="3"/><polyline points="1132,587 1132,623 750,623" fill="none" stroke="#327CB5" stroke-width="3"/><polyline points="750,623 750,654" fill="none" stroke="#327CB5" stroke-width="3" marker-end="url(#arr)"/><rect x="135" y="661" width="1230" height="86" rx="10" fill="#EAF2FB" stroke="#BDD3EB" stroke-width="2"/><text x="750" y="695" font-size="30" fill="#163E6B" font-weight="700" text-anchor="middle">共用结果与引用检查 · 人员复核 · 版本记录</text><text x="750" y="735" font-size="26" fill="#173F6F" font-weight="400" text-anchor="middle">现阶段全部结果保留复核；核验完成不等于贷款批准</text><polyline points="750,747 750,774" fill="none" stroke="#327CB5" stroke-width="3" marker-end="url(#arr)"/><rect x="135" y="781" width="1230" height="97" rx="10" fill="#F4F8FC" stroke="#BDD3EB" stroke-width="2"/><text x="750" y="819" font-size="30" fill="#173F6F" font-weight="700" text-anchor="middle">先比较质量与证据，再核算完整工程收益</text><text x="750" y="856" font-size="27" fill="#173F6F" font-weight="400" text-anchor="middle">材料规则＋模型资源＋失败重试＋人员承接＋运维摊销</text><text x="750" y="923" font-size="24" fill="#4B6580" font-weight="400" text-anchor="middle">实验对照设计：相同任务与质量要求，比较完整处理开销</text></g></svg>