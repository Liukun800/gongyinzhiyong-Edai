oke-width="2" rx="8"></rect><path d="M52,242 H448" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="250.0" y="278" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="396">04 冻结独立评价</text><text x="62" y="336" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="400" text-anchor="start" data-fit-width="376">采用新的未见资料</text><text x="62" y="379" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="400" text-anchor="start" data-fit-width="376">分别报告质量与成本</text><line x1="485" y1="326" x2="630" y2="326" stroke="#BDD3E6" stroke-width="3"></line><text x="750" y="446" fill="#59758A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="middle" data-fit-width="1430">评价未达要求时回到候选开发；开发资料与独立评价资料分别管理。</text></svg>