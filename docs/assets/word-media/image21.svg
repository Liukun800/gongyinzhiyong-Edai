)"></path><path d="M634.9056319458158,323.14533927343956 A160,160 0 0 1 632.9834077409328,102.88026239000027" fill="none" stroke="#236BB0" stroke-width="6" marker-end="url(#arrow)"></path><circle cx="750" cy="212" r="104" fill="url(#panel)" stroke="#A9C9E5" stroke-width="2"></circle><text x="750" y="204" fill="#174B78" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="34" font-weight="700" text-anchor="middle" data-fit-width="185">领域适配</text><text x="750" y="250" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="400" text-anchor="middle" data-fit-width="185">版本验证</text><rect x="47" y="34" width="420" height="155" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="40" y="25" width="420" height="155" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="40" y="25" width="420" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M52,27 H448" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="250.0" y="63" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="396">01 登记错误与原文</text><text x="62" y="121" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="400" text-anchor="start" data-fit-width="376">区分漏识别与误报</text><text x="62" y="164" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="400" text-anchor="start" data-fit-width="376">记录材料、标签与模型</text><line x1="485" y1="100" x2="630" y2="100" stroke="#BDD3E6" stroke-width="3"></line><rect x="1047" y="34" width="420" height="155" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="1040" y="25" width="420" height="155" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="1040" y="25" width="420" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M1052,27 H1448" st