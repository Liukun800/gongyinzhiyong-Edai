ue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M52,117 H353" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="202.5" y="153" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="301">材料准备</text><text x="62" y="211" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">归集、解析与口径核对</text><text x="62" y="254" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">记录材料版本</text><path d="M374,213 L395,213" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><rect x="412" y="124" width="325" height="205" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="405" y="115" width="325" height="205" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="405" y="115" width="325" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M417,117 H718" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="567.5" y="153" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="301">规则与判断</text><text x="427" y="211" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">排队、推理与异常</text><text x="427" y="254" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">记录两层调用用量</text><path d="M739,213 L760,213" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><rect x="777" y="124" width="325" height="205" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="770" y="115" width="325" height="205" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="770" y="115" width="325" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M782,117 H1083" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="932.5" y="153" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="301">疑点处置</text><text x="792" y="211" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">查证、补件与人员纠正</text><text x="792" y="254" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">记录有效操作工时</text><path d="M1104,213 L1125,213" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><rect x="1142" y="124" width="325" height="205" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="1135" y="115" width="325" height="205" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="1135" y="115" width="325" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M1147,117 H1448" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="1297.5" y="153" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="301">事项交接</text><text x="1157" y="211" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">复核摘要与未决事项</text><text x="1157" y="254" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">记录遗漏及返工</text><rect x="40" y="360" width="1420" height="88" fill="#EAF3FB" stroke="#BDD3E6" stroke-width="2" rx="6"></rect><text x="750" y="393" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="700" text-anchor="middle" data-fit-width="1370">系统响应  请求发起至完整结构化返回</text><text x="750" y="430" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="middle" data-fit-width="1370">人员操作与外部等待分别计量，不以调用次数替代业务效率</text></svg>