<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 420" width="1500" height="420" role="img"><title>首期切入与价值验证链条</title><defs><linearGradient id="panel" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#FFFFFF"></stop><stop offset="100%" stop-color="#DDEDFB"></stop></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#519CE0"></stop><stop offset="55%" stop-color="#236BB0"></stop><stop offset="100%" stop-color="#174B78"></stop></linearGradient><linearGradient id="deep" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#387CB6"></stop><stop offset="100%" stop-color="#123E69"></stop></linearGradient><linearGradient id="pale" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#F6FBFF"></stop><stop offset="100%" stop-color="#AFCFEB"></stop></linearGradient><filter id="shadow" x="-15%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#235A87" flood-opacity="0.13"></feDropShadow></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#236BB0"></path></marker></defs><rect x="0" y="0" width="1500" height="420" fill="#FFFFFF" stroke="none" stroke-width="2" rx="6"></rect><rect x="47" y="59" width="325" height="200" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="40" y="50" width="325" height="200" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="40" y="50" width="325" height="55" fill="url(#deep)" stroke="none" stroke-width="2" rx="8"></rect><path d="M52,52 H353" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="202.5" y="88" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="301">材料关系核验</text><text x="62" y="146" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="281">资金用途一致性</text><text x="62" y="189" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="281">经营陈述矛盾</text><path d="M375,150 L393,150" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><rect x="412" y="59" width="325" height="200" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="405" y="50" width="325" height="200" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="405" y="50" width="325" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M417,52 H718" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="567.5" y="88" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="301">证据与事项组织</text><text x="427" y="146" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="281">限定建议与成对原文</text><text x="427" y="189" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="281">缺件与未决事项</text><path d="M740,150 L758,150" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><rect x="777" y="59" width="325" height="200" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="770" y="50" width="325" height="200" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="770" y="50" width="325" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M782,52 H1083" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="932.5" y="88" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="301">人员核实与交接</text><text x="792" y="146" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="281">按缺项补件或核实</text><text x="792" y="189" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="281">确认、更正并流转</text><path d="M1105,150 L1123,150" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><rect x="1142" y="59" width="325" height="200" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="1135" y="50" width="325" height="200" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="1135" y="50" width="325" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M1147,52 H1448" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="1297.5" y="88" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="301">业务增量评价</text><text x="1157" y="146" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="281">关键错误与查证工时</text><text x="1157" y="189" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="281">响应与完整成本</text><rect x="44" y="305" width="1420" height="58" fill="#CFDFEE" stroke="none" stroke-width="2" rx="6"></rect><rect x="40" y="300" width="1420" height="58" fill="url(#deep)" stroke="none" stroke-width="2" rx="6"></rect><text x="750" y="339" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="1370">验证对象为单项材料核验及结果交接，授信决策沿用既有授权流程</text><text x="750" y="405" fill="#59758A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="middle" data-fit-width="1430">价值评价覆盖材料核验与事项交接，具体收益依据同任务业务记录。</text></svg>