<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 430" width="1500" height="430" role="img"><title>异常停止与业务恢复闭环</title><defs><linearGradient id="panel" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#FFFFFF"></stop><stop offset="100%" stop-color="#DDEDFB"></stop></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#519CE0"></stop><stop offset="55%" stop-color="#236BB0"></stop><stop offset="100%" stop-color="#174B78"></stop></linearGradient><linearGradient id="deep" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#387CB6"></stop><stop offset="100%" stop-color="#123E69"></stop></linearGradient><linearGradient id="pale" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#F6FBFF"></stop><stop offset="100%" stop-color="#AFCFEB"></stop></linearGradient><filter id="shadow" x="-15%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#235A87" flood-opacity="0.13"></feDropShadow></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#236BB0"></path></marker></defs><rect x="0" y="0" width="1500" height="430" fill="#FFFFFF" stroke="none" stroke-width="2" rx="6"></rect><rect x="47" y="49" width="325" height="220" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="40" y="40" width="325" height="220" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="40" y="40" width="325" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M52,42 H353" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="202.5" y="78" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="301">发现触发条件</text><text x="62" y="136" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">越权或依据不可追溯</text><text x="62" y="179" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">关键错误超过约定上限</text><path d="M374,150 L395,150" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><rect x="412" y="49" width="325" height="220" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="405" y="40" width="325" height="220" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="405" y="40" width="325" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M417,42 H718" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="567.5" y="78" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="301">停止相关任务</text><text x="427" y="136" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">暂停采用相关建议</text><text x="427" y="179" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">原业务处理持续运行</text><path d="M739,150 L760,150" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><rect x="777" y="49" width="325" height="220" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="770" y="40" width="325" height="220" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="770" y="40" width="325" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M782,42 H1083" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="932.5" y="78" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="301">承接与定位</text><text x="792" y="136" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">保留已有记录与待办</text><text x="792" y="179" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">责任方核实并修复</text><path d="M1104,150 L1125,150" fill="none" stroke="#236BB0" stroke-width="3" marker-end="url(#arrow)"></path><rect x="1142" y="49" width="325" height="220" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="1135" y="40" width="325" height="220" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="1135" y="40" width="325" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M1147,42 H1448" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="1297.5" y="78" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="301">验证后恢复</text><text x="1157" y="136" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">完成回归与责任确认</text><text x="1157" y="179" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="start" data-fit-width="281">按获准范围恢复</text><rect x="44" y="315" width="1420" height="58" fill="#CFDFEE" stroke="none" stroke-width="2" rx="6"></rect><rect x="40" y="310" width="1420" height="58" fill="url(#deep)" stroke="none" stroke-width="2" rx="6"></rect><text x="750" y="349" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="1370">停止的是受影响组件任务，材料、历史结果与人员承接记录保留</text><text x="750" y="409" fill="#59758A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="middle" data-fit-width="1430">新增任务与模型版本分别验收，持续监测适用范围。</text></svg>