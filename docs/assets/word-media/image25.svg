<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 480" width="1500" height="480" role="img"><title>分层处理的完整成本构成</title><defs><linearGradient id="panel" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#FFFFFF"></stop><stop offset="100%" stop-color="#DDEDFB"></stop></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#519CE0"></stop><stop offset="55%" stop-color="#236BB0"></stop><stop offset="100%" stop-color="#174B78"></stop></linearGradient><linearGradient id="deep" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#387CB6"></stop><stop offset="100%" stop-color="#123E69"></stop></linearGradient><linearGradient id="pale" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0%" stop-color="#F6FBFF"></stop><stop offset="100%" stop-color="#AFCFEB"></stop></linearGradient><filter id="shadow" x="-15%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#235A87" flood-opacity="0.13"></feDropShadow></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#236BB0"></path></marker></defs><rect x="0" y="0" width="1500" height="480" fill="#FFFFFF" stroke="none" stroke-width="2" rx="6"></rect><rect x="47" y="34" width="690" height="270" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="40" y="25" width="690" height="270" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="40" y="25" width="690" height="55" fill="url(#blue)" stroke="none" stroke-width="2" rx="8"></rect><path d="M52,27 H718" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="385.0" y="63" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="666">对照路径完整成本</text><text x="62" y="121" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="646">共同材料准备与规则处理</text><text x="62" y="164" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="646">生成模型的实际调用开销</text><text x="62" y="207" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="646">人员复核、补件及纠正</text><text x="62" y="250" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="646">部署、监控与维护分摊</text><rect x="777" y="34" width="690" height="270" fill="#CEDFEF" stroke="none" stroke-width="2" rx="8"></rect><rect x="770" y="25" width="690" height="270" fill="url(#panel)" stroke="#BDD3E6" stroke-width="2" rx="8"></rect><rect x="770" y="25" width="690" height="55" fill="url(#deep)" stroke="none" stroke-width="2" rx="8"></rect><path d="M782,27 H1448" stroke="#9DC8EC" stroke-width="2" opacity=".7"></path><text x="1115.0" y="63" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="666">分层路径完整成本</text><text x="792" y="121" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="646">相同材料准备与规则处理</text><text x="792" y="164" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="646">快判断＋按需慢分析开销</text><text x="792" y="207" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="646">人员复核、补件及纠正</text><text x="792" y="250" fill="#23465F" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-fit-width="646">路由、部署与维护分摊</text><rect x="44" y="345" width="1420" height="58" fill="#CFDFEE" stroke="none" stroke-width="2" rx="6"></rect><rect x="40" y="340" width="1420" height="58" fill="url(#deep)" stroke="none" stroke-width="2" rx="6"></rect><text x="750" y="379" fill="white" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="31" font-weight="700" text-anchor="middle" data-fit-width="1370">净节约 = 对照路径完整成本 − 分层路径完整成本</text><text x="750" y="452" fill="#59758A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="27" font-weight="400" text-anchor="middle" data-fit-width="1430">仅在质量与人员负担满足要求时评价净节约，实际用量与计价条件共同记录。</text></svg>