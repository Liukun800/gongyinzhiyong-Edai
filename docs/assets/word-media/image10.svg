<rect x="125" y="257" width="7" height="142" rx="0" fill="#176AB1" stroke="#176AB1" stroke-width="2"/>
<text id="t5" x="331.0" y="305.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="35" fill="#176AB1" font-weight="700" text-anchor="middle" data-fit-width="380">接入任务与材料</text>
<text id="t6" x="331.0" y="356" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" fill="#183B60" font-weight="400" text-anchor="middle" data-fit-width="382">确认主体、期间及原文</text>
<rect x="700" y="257" width="400" height="142" rx="8" fill="white" stroke="#B9D5EB" stroke-width="2"/>
<rect x="700" y="257" width="7" height="142" rx="0" fill="#176AB1" stroke="#176AB1" stroke-width="2"/>
<text id="t7" x="900.0" y="305.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="35" fill="#176AB1" font-weight="700" text-anchor="middle" data-fit-width="368">输入条件核对</text>
<text id="t8" x="900.0" y="356" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" fill="#183B60" font-weight="400" text-anchor="middle" data-fit-width="370">完整性与可比条件</text>
<rect x="1272" y="257" width="414" height="142" rx="8" fill="white" stroke="#B9D5EB" stroke-width="2"/>
<rect x="1272" y="257" width="7" height="142" rx="0" fill="#176AB1" stroke="#176AB1" stroke-width="2"/>
<text id="t9" x="1479.0" y="305.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="35" fill="#176AB1" font-weight="700" text-anchor="middle" data-fit-width="382">列出具体缺项</text>
<text id="t10" x="1479.0" y="356" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" fill="#183B60" font-weight="400" text-anchor="middle" data-fit-width="384">补充后重新核验</text>
<rect x="626" y="470" width="548" height="130" rx="5" fill="url(#panel)" stroke="#176AB1" stroke-width="3"/>
<text id="t11" x="900" y="521.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" fill="#103E70" font-weight="700" text-anchor="middle" data-fit-width="510">规则判断 / Jev语义判断</text>
<text id="t12" x="900" y="568.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" fill="#183B60" font-weight="400" text-anchor="middle" data-fit-width="510">确定性事项用规则，语义任务用Jev</text>
<rect x="140" y="674" width="500" height="220" rx="5" fill="url(#panel)" stroke="#B9D5EB" stroke-width="2"/>
<rect x="140" y="674" width="500" height="60" rx="2" fill="#103E70" stroke="#103E70" stroke-width="2"/>
<text id="t13" x="390.0" y="715.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" fill="white" font-weight="700" text-anchor="middle" data-fit-width="480">明确矛盾</text>
<text id="t14" x="390" y="790" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" fill="#183B60" font-weight="400" text-anchor="middle" data-fit-width="460">定位相反原文</text>
<text id="t15" x="390" y="845" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" fill="#183B60" font-weight="400" text-anchor="middle" data-fit-width="460">直接交人员核实</text>
<rect x="650" y="674" width="500" height="220" rx="5" fill="url(#panel)" stroke="#B9D5EB" stroke-width="2"/>
<rect x="650" y="674" width="500" height="60" rx="2" fill="#176AB1" stroke="#176AB1" stroke-width="2"/>
<text id="t16" x="900.0" y="715.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" fill="white" font-weight="700" text-anchor="middle" data-fit-width="480">语义不确定</text>
<text id="t17" x="900" y="790" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" fill="#183B60" font-weight="400" text-anchor="middle" data-fit-width="460">材料充分时按需分析</text>
<text id="t18" x="900" y="845" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" fill="#183B60" font-weight="400" text-anchor="middle" data-fit-width="460">检查返回结果与引用</text>
<rect x="1160" y="674" width="500" height="220" rx="5" fill="url(#panel)" stroke="#B9D5EB" stroke-width="2"/>
<rect x="1160" y="674" width="500" height="60" rx="2" fill="#176AB1" stroke="#176AB1" stroke-width="2"/>
<text id="t19" x="1410.0" y="715.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" fill="white" font-weight="700" text-anchor="middle" data-fit-width="480">满足本项核验条件</text>
<text id="t20" x="1410" y="790" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" fill="#183B60" font-weight="400" text-anchor="middle" data-fit-width="460">保留比较范围与原文</text>
<text id="t21" x="1410" y="845" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" fill="#183B60" font-weight="400" text-anchor="middle" data-fit-width="460">首期交人员复核确认</text>
<rect x="223" y="953" width="1354" height="60" rx="2" fill="#103E70" stroke="#103E70" stroke-width="2"/>
<text id="t22" x="900.0" y="994.0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" fill="white" font-weight="700" text-anchor="middle" data-fit-width="1334">人员确认或纠正  ·  失败转交处理  ·  未解决事项与材料版本留痕</text>
</svg>