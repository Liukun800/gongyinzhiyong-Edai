<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1668" height="810" viewBox="95 214 1668 810" role="img" aria-labelledby="title desc"><title id="title">贷前材料核验任务分流</title><desc id="desc">区分客观缺项、明确矛盾和模型语义不确定，避免错误补件</desc>
<defs>
  <linearGradient id="header" x1="0" x2="1"><stop stop-color="#103E70"/><stop offset="1" stop-color="#176AB1"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F2F8FE"/><stop offset="1" stop-color="white"/></linearGradient>
  <linearGradient id="ribbon" x1="0" x2="1"><stop stop-color="#176AB1"/><stop offset="1" stop-color="#419ED0"/></linearGradient>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#176AB1"/></marker>
  <marker id="bigarrow" markerWidth="22" markerHeight="22" refX="17" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L22 11 L0 22 Z" fill="#419ED0"/></marker>
  </defs>
<rect width="1668" height="810" fill="white" x="95" y="214"/>
