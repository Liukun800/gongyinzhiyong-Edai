<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2b73bd"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="58" font-size="34" fill="#123d69" font-weight="700">核验的是材料关系，交付的是人员可以承接的事项</text><text x="40" y="102" font-size="25" fill="#557596" font-weight="400">两项首期任务 · 同一申请按问题分别处理 · 本图说明业务设计</text><rect x="40" y="145" width="1320" height="190" rx="16" fill="#f6f9ff" stroke="#c5d9ef" stroke-width="2"/><text x="65" y="187" font-size="29" fill="#123d69" font-weight="700">资金用途一致性</text><rect x="65" y="210" width="355" height="63" rx="16" fill="#e4efff" stroke="#c5d9ef" stroke-width="2"/><text x="84" y="250" font-size="25" fill="#123d69" font-weight="400">申请：借款只买原材料</text><rect x="465" y="210" width="355" height="63" rx="16" fill="#e4efff" stroke="#c5d9ef" stroke-width="2"/><text x="484" y="250" font-size="25" fill="#123d69" font-weight="400">订单：采购范围与资金归属</text><path d="M830,242 L890,242" fill="none" stroke="#2b73bd" stroke-width="3" marker-end="url(#arrow)"/><rect x="915" y="210" width="415" height="63" rx="16" fill="#155aa1" stroke="#155aa1" stroke-width="2"/><text x="937" y="250" font-size="25" fill="white" font-weight="700">任务答案 + 成对原文 + 待办</text><text x="66" y="310" font-size="25" fill="#42698e" font-weight="400">先确认借款范围，再判断支持、矛盾或信息不足</text><rect x="40" y="365" width="1320" height="190" rx="16" fill="#f6f9ff" stroke="#c5d9ef" stroke-width="2"/><text x="65" y="407" font-size="29" fill="#123d69" font-weight="700">经营陈述矛盾</text><rect x="65" y="430" width="355" height="63" rx="16" fill="#e4efff" stroke="#c5d9ef" stroke-width="2"/><text x="84" y="470" font-size="25" fill="#123d69" font-weight="400">说明：经营状态与渠道</text><rect x="465" y="430" width="355" height="63" rx="16" fill="#e4efff" stroke="#c5d9ef" stroke-width="2"/><text x="484" y="470" font-size="25" fill="#123d69" font-weight="400">记录：同范围的经营事实</text><path d="M830,462 L890,462" fill="none" stroke="#2b73bd" stroke-width="3" marker-end="url(#arrow)"/><rect x="915" y="430" width="415" height="63" rx="16" fill="#155aa1" stroke="#155aa1" stroke-width="2"/><text x="937" y="470" font-size="25" fill="white" font-weight="700">任务答案 + 成对原文 + 待办</text><text x="66" y="530" font-size="25" fill="#42698e" font-weight="400">先对齐门店、渠道、期间和指标，再比较事实</text><text x="42" y="610" font-size="25" fill="#557596" font-weight="400">人员核对并确认或纠正；材料一致不证明交易真实，核验完成不等于授信通过。</text></g></svg>