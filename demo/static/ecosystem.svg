<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">贷前材料核验组件的拟议业务协同</title><desc id="desc">材料包经规则检查后进入Jev式判断，材料缺项或口径不符转人员；复杂分析按需调用。所有结果保留原文，经人员处理后组成拟议工小审结果包。当前银行侧连接为设计。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f8ff"/><stop offset="1" stop-color="#eaf2ff"/></linearGradient><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#77a1d7"/></marker></defs>
<rect width="1200" height="640" rx="16" fill="url(#bg)"/>
<g font-family="Microsoft YaHei, sans-serif"><text x="45" y="48" fill="#244f86" font-size="22" font-weight="bold">从材料归集到审查待办：本项目的拟议介入方式</text><text x="45" y="77" fill="#718aaa" font-size="13">银行侧输入与回传以本地材料包模拟；不表示工行内部系统的实际调用结构。</text>
<rect x="65" y="105" width="1070" height="70" rx="11" fill="#fff" stroke="#c5d8f2"/><text x="90" y="133" font-size="12" fill="#6c8eb7">上游材料归集</text><text x="600" y="147" text-anchor="middle" font-size="19" fill="#365f90">申请用途 · 采购证明 · 经营陈述 · 对应记录</text>
<path d="M210 175V222" stroke="#77a1d7" stroke-width="2" marker-end="url(#arr)"/>
<rect x="65" y="233" width="270" height="100" rx="12" fill="#fff" stroke="#a8c7ef"/><text x="200" y="265" text-anchor="middle" font-size="12" fill="#7396c0">确定性条件</text><text x="200" y="294" text-anchor="middle" font-size="21" font-weight="bold" fill="#2f619b">规则预检</text><text x="200" y="319" text-anchor="middle" font-size="13" fill="#6b89ad">完整性 / 主体 / 期间</text>
<path d="M335 282H420" stroke="#77a1d7" stroke-width="2" marker-end="url(#arr)"/><text x="378" y="265" text-anchor="middle" font-size="12" fill="#5f82af">具备条件</text>
<rect x="432" y="233" width="300" height="100" rx="12" fill="#2469d4"/><text x="582" y="264" text-anchor="middle" font-size="12" fill="#cce1ff">SYSTEM 1</text><text x="582" y="294" text-anchor="middle" font-size="21" font-weight="bold" fill="#fff">Jev式有限判断</text><text x="582" y="319" text-anchor="middle" font-size="13" fill="#d3e6ff">用途一致性 / 经营陈述矛盾</text>
<path d="M732 282H844" stroke="#77a1d7" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="787" y="259" text-anchor="middle" font-size="12" fill="#5f82af">按需升级</text><text x="787" y="308" text-anchor="middle" font-size="10" fill="#8ba2bf">满足实验条件</text>
<rect x="855" y="233" width="280" height="100" rx="12" fill="#fff" stroke="#a8c7ef"/><text x="995" y="264" text-anchor="middle" font-size="12" fill="#7396c0">SYSTEM 2</text><text x="995" y="294" text-anchor="middle" font-size="21" font-weight="bold" fill="#2f619b">复杂关系分析</text><text x="995" y="319" text-anchor="middle" font-size="13" fill="#6b89ad">拟协同工银智涌</text>
<g stroke="#87a9d5" stroke-width="1.7" fill="none" marker-end="url(#arr)"><path d="M200 334V368"/><path d="M582 334V368"/><path d="M995 334V368"/></g>
<rect x="65" y="379" width="270" height="62" rx="8" fill="#e5eefb"/><rect x="432" y="379" width="300" height="62" rx="8" fill="#e5eefb"/><rect x="855" y="379" width="280" height="62" rx="8" fill="#e5eefb"/>
<text x="200" y="405" text-anchor="middle" font-size="14" fill="#436c9d">缺项 / 不可比较</text><text x="200" y="426" text-anchor="middle" font-size="12" fill="#718bad">补件或口径核实</text><text x="582" y="405" text-anchor="middle" font-size="14" fill="#436c9d">有限建议 / 明确矛盾 / 语义不确定</text><text x="582" y="426" text-anchor="middle" font-size="12" fill="#718bad">结合原文交由人员处理</text><text x="995" y="405" text-anchor="middle" font-size="14" fill="#436c9d">分析建议 / 异常接管</text><text x="995" y="426" text-anchor="middle" font-size="12" fill="#718bad">本地通用模型仅作实验替代</text>
<path d="M200 441V466H995V441M582 441V480" stroke="#87a9d5" stroke-width="1.7" fill="none"/><path d="M582 470V488" stroke="#87a9d5" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="65" y="500" width="1070" height="76" rx="11" fill="#173e70"/><text x="600" y="532" text-anchor="middle" font-size="19" fill="#fff" font-weight="bold">人员处理 → 核验建议 + 原文依据 + 材料版本 + 待处理事项</text><text x="600" y="556" text-anchor="middle" font-size="13" fill="#bdd4f1">形成本地结果包，拟由工小审相关审查位置承接；后续授信授权保留在原业务体系。</text>
<text x="600" y="613" text-anchor="middle" font-size="12" fill="#6c87a9">首期运行 Choice 类有限判断；Score / Noul 为后续扩展研究。当前所有核验建议保留人工复核。</text></g></svg>
