<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#2b73bd"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="40" y="58" font-size="34" fill="#123d69" font-weight="700">每条核验建议都带着依据和处理状态交接</text><text x="40" y="105" font-size="25" fill="#557596" font-weight="400">拟议工小审协同 · 接收任务与材料，返回核验事项包</text><rect x="40" y="160" width="310" height="340" rx="16" fill="#edf4ff" stroke="#c5d9ef" stroke-width="2"/><text x="64" y="204" font-size="29" fill="#123d69" font-weight="700">材料归集后的任务</text><text x="64" y="260" font-size="26" fill="#123d69" font-weight="400">申请与任务范围</text><text x="64" y="315" font-size="26" fill="#123d69" font-weight="400">材料原文与有效版本</text><text x="64" y="370" font-size="26" fill="#123d69" font-weight="400">缺项与可比条件</text><text x="64" y="425" font-size="26" fill="#123d69" font-weight="400">既有核验要求</text><path d="M362,327 L424,327" fill="none" stroke="#2b73bd" stroke-width="3" marker-end="url(#arrow)"/><rect x="445" y="160" width="515" height="340" rx="16" fill="#f7faff" stroke="#c5d9ef" stroke-width="2"/><text x="469" y="204" font-size="29" fill="#123d69" font-weight="700">本组件组织的核验事项包</text><text x="469" y="260" font-size="26" fill="#123d69" font-weight="400">答案与来源：保留原始建议</text><text x="469" y="315" font-size="26" fill="#123d69" font-weight="400">成对原文：定位到材料段落</text><text x="469" y="370" font-size="26" fill="#123d69" font-weight="400">待办与依据：补件、核实、复核</text><text x="469" y="425" font-size="26" fill="#123d69" font-weight="400">版本与记录：保留纠正及未决项</text><path d="M973,327 L1020,327" fill="none" stroke="#2b73bd" stroke-width="3" marker-end="url(#arrow)"/><rect x="1040" y="160" width="320" height="340" rx="16" fill="#155aa1" stroke="#155aa1" stroke-width="2"/><text x="1064" y="204" font-size="29" fill="white" font-weight="700">后续评审承接</text><text x="1064" y="260" font-size="26" fill="white" font-weight="400">查看并处理疑点</text><text x="1064" y="315" font-size="26" fill="white" font-weight="400">确认或纠正建议</text><text x="1064" y="370" font-size="26" fill="white" font-weight="400">材料更新后重核</text><text x="1064" y="425" font-size="26" fill="white" font-weight="400">保留综合审查职责</text><text x="40" y="563" font-size="26" fill="#42698e" font-weight="400">已有信息直接复核；缺失事实先补齐；材料充分但关系复杂时再按需慢分析。</text><text x="40" y="610" font-size="25" fill="#557596" font-weight="400">字段及权限由银行适配阶段确认。本地结果包不发出授信、额度、利率或放款指令。</text></g></svg>